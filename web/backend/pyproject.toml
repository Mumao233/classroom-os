[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-os-web-backend"
version = "0.1.0a1"
description = "Independent Classroom OS Web data foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3==1.44.3",
  "SQLAlchemy==2.0.46",
  "alembic==1.18.4",
  "psycopg[binary]==3.3.3",
  "argon2-cffi==25.1.0",
  "fastapi==0.162.4",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
  "websockets==17.4",
  "cryptography==50.0.2",
  "pyotp==2.9.0",
  "rfc8785==0.1.4",
  "jsonschema==4.26.0",
  "httpx==0.28.1",
  "Pillow==13.0.0",
]

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[project.scripts]
classroom-recovery = "classroom_web.entrypoints.recovery_cli:main"

[tool.setuptools.packages.find]
include = ["classroom_web*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
