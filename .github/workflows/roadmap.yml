name: Roadmap / GitHub Pages

on:
  pull_request:
    paths:
      - "docs/roadmap/**"
      - "scripts/roadmap.py"
      - "tools/roadmap/**"
      - ".github/workflows/roadmap.yml"
  push:
    branches: [main]
    paths:
      - "docs/roadmap/**"
      - "scripts/roadmap.py"
      - "tools/roadmap/**"
      - ".github/workflows/roadmap.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roadmap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/roadmap.py check
      - run: python -m unittest discover -s tools/roadmap -v

  build:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export page and current phases.json together
        run: python scripts/roadmap.py site _site --readonly
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy roadmap to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
