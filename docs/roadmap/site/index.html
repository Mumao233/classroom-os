<style>
  :root { --bg:#fafaf9; --fg:#1c1917; --muted:#78716c; --line:#e7e5e4; --panel:#ffffff; --soft:#f5f5f4; --acc:#1c1917; --accfg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1c1917; --fg:#f5f5f4; --muted:#a8a29e; --line:#44403c; --panel:#292524; --soft:#1f1d1b; --acc:#f5f5f4; --accfg:#1c1917; }
  }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif; }
  header { background:var(--panel); border-bottom:1px solid var(--line); position:relative; z-index:4; }
  .row { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:8px 14px; }
  .row + .row { border-top:1px solid var(--line); padding-top:7px; padding-bottom:7px; }
  h1 { font-size:15px; font-weight:600; margin:0; white-space:nowrap; }
  .progress { display:flex; align-items:center; gap:8px; font-size:13px; }
  .track { width:140px; height:8px; border-radius:4px; background:var(--soft); border:1px solid var(--line); overflow:hidden; }
  .fill { height:100%; background:#16a34a; width:0; transition:width .3s; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; font-size:12px; }
  .chip { display:inline-flex; align-items:center; gap:5px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .dot { width:10px; height:10px; border-radius:3px; border:1.5px solid; flex:none; display:inline-block; }
  .spacer { flex:1; }
  .src { font-size:11px; color:var(--muted); display:inline-flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .src .warn { color:#b45309; }
  .src button { font-size:11px; padding:2px 7px; }
  .search { position:relative; }
  .search input { font:inherit; font-size:12px; width:200px; padding:5px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  .search span { position:absolute; right:8px; top:6px; font-size:11px; color:var(--muted); pointer-events:none; }
  button, .btn { font:inherit; font-size:12px; padding:5px 10px; border:1px solid var(--line); border-radius:6px;
    background:var(--bg); color:var(--fg); cursor:pointer; white-space:nowrap; line-height:1.3; }
  button:hover, .btn:hover { border-color:var(--muted); }
  .btn input { display:none; }
  .group { display:flex; align-items:center; gap:4px; font-size:12px; }
  .group > b { font-weight:500; color:var(--muted); margin-right:2px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:0; border-radius:0; border-right:1px solid var(--line); background:transparent; }
  .seg button:last-child { border-right:0; }
  .seg button.on, button.tog.on { background:var(--acc); color:var(--accfg); border-color:var(--acc); }
  .hint { font-size:11px; color:var(--muted); }
  main { position:absolute; top:var(--top,96px); left:0; right:0; bottom:0; display:flex; }
  #left { position:relative; flex:1; overflow:hidden; }
  body.board .g-only { display:none !important; }
  body:not(.board) .b-only { display:none !important; }
  .tabs button { font-weight:600; padding:5px 14px; }
  #board { position:absolute; inset:0; overflow:auto; background:var(--bg); padding:16px; display:none; }
  body.board #board { display:grid; grid-template-columns:repeat(auto-fill, minmax(270px, 1fr)); grid-auto-rows:max-content; gap:12px; align-content:start; }
  .group.b-only { min-width:0; max-width:100%; }
  #filters { overflow-x:auto; max-width:calc(100vw - 72px); scrollbar-width:none; }
  #filters button { flex:none; }
  .mod { background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; display:flex; flex-direction:column; }
  .mod-h { padding:10px 12px 9px; border-bottom:1px solid var(--line); }
  .mod-h .row1 { display:flex; align-items:baseline; gap:8px; }
  .mod-h .n { font-size:12px; font-weight:700; color:var(--muted); letter-spacing:.04em; }
  .mod-h .t { font-weight:600; font-size:14px; flex:1; }
  .mod-h .pg { font-size:11px; color:var(--muted); white-space:nowrap; }
  .mbar { height:4px; background:var(--soft); border-radius:2px; margin-top:8px; overflow:hidden; }
  .mbar i { display:block; height:100%; background:#16a34a; transition:width .3s; }
  .cards { padding:8px; display:flex; flex-direction:column; gap:7px; }
  .card { display:block; width:100%; text-align:left; border:1.5px solid; border-radius:9px; padding:9px 10px 8px; cursor:pointer; font:inherit; transition:transform .12s, box-shadow .12s; }
  .card:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(0,0,0,.10); }
  .card.on { outline:2.5px solid var(--fg); outline-offset:1.5px; }
  .card .top { display:flex; justify-content:space-between; gap:6px; font-size:11px; font-weight:700; }
  .card .tt { font-size:13px; font-weight:600; margin:3px 0 6px; line-height:1.35; }
  .card .meta { display:flex; flex-wrap:wrap; gap:4px; }
  .card .pill { font-size:10.5px; font-weight:500; padding:1px 6px; border-radius:5px; background:rgba(255,255,255,.6); border:1px solid rgba(0,0,0,.10); white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  .card .pill.hot { background:#fee2e2; border-color:#fca5a5; color:#991b1b; }
  .board-empty { grid-column:1/-1; color:var(--muted); padding:40px; text-align:center; }
  .seg button .c { opacity:.6; margin-left:3px; font-size:11px; }
  #stage { position:absolute; inset:0; overflow:hidden; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; }
  #stage.dragging { cursor:grabbing; }
  #canvas { transform-origin:0 0; position:absolute; top:0; left:0; }
  #canvas svg { max-width:none !important; display:block; }
  #canvas .node { cursor:pointer; }
  #canvas .node, #canvas .flowchart-link, #canvas .edgeLabel { transition:opacity .15s; }
  aside { width:320px; border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:14px 16px 48px; font-size:13px; }
  aside h2 { font-size:12px; font-weight:600; margin:16px 0 6px; display:flex; align-items:center; gap:6px; }
  aside h2:first-child { margin-top:0; }
  aside ul { list-style:none; margin:0; padding:0; }
  aside li { padding:4px 6px; border-radius:6px; line-height:1.4; display:flex; gap:6px; align-items:baseline; }
  aside li.link { cursor:pointer; }
  aside li.link:hover { background:var(--soft); }
  aside li .sub { display:block; font-size:11px; color:var(--muted); }
  aside .empty { color:var(--muted); font-size:12px; padding:2px 6px; }
  aside .muted { color:var(--muted); font-size:12px; }
  aside .title { font-size:16px; font-weight:600; margin:0 0 4px; display:flex; gap:8px; align-items:flex-start; }
  aside .title span { flex:1; }
  aside .x { padding:1px 8px; }
  .tags { display:flex; flex-wrap:wrap; gap:5px; margin:6px 0 10px; }
  .tag { font-size:11px; padding:2px 7px; border-radius:999px; background:var(--soft); border:1px solid var(--line); }
  .tag.hot { background:#fee2e2; border-color:#fca5a5; color:#991b1b; }
  .tag.ok { background:#dcfce7; border-color:#86efac; color:#166534; }
  .stbtns { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; }
  .stbtns button { padding:5px 2px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; }
  .stbtns button.on { border-color:var(--fg); font-weight:600; box-shadow:inset 0 0 0 1px var(--fg); }
  .field { margin-top:12px; }
  .field label { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; }
  .field input, .field textarea { width:100%; font:inherit; font-size:12px; padding:6px 8px; border:1px solid var(--line);
    border-radius:6px; background:var(--bg); color:var(--fg); }
  .field textarea { min-height:54px; resize:vertical; }
  .inline { display:flex; gap:6px; }
  .inline input { flex:1; }
  .prs a { color:#2563eb; text-decoration:none; word-break:break-all; }
  .prs a:hover { text-decoration:underline; }
  .rm { margin-left:auto; padding:0 6px; font-size:11px; color:var(--muted); }
  .mark { width:14px; flex:none; text-align:center; font-size:11px; }
  .legend { display:flex; flex-direction:column; gap:4px; font-size:12px; }
  .legend div { display:flex; align-items:center; gap:7px; }
  .scale { display:flex; height:10px; border-radius:3px; overflow:hidden; border:1px solid var(--line); margin:4px 0 2px; }
  .scale i { flex:1; }
  .lines { font-size:11px; color:var(--muted); line-height:1.75; margin-top:16px; border-top:1px solid var(--line); padding-top:10px; }
  #chart svg { width:100%; height:auto; display:block; }
  #panelToggle { display:none; }
  @media (max-width: 900px) {

    #panelToggle { display:inline-block; }

  #tip .m { color:var(--muted); }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:20; display:none; align-items:center; justify-content:center; padding:16px; }

  #modal textarea { width:100%; height:220px; font:12px ui-monospace, Menlo, Consolas, monospace; padding:8px;

  #modal .act { display:flex; gap:8px; justify-content:flex-end; margin-top:10px; align-items:center; }
  #modal .act span { font-size:12px; color:var(--muted); margin-right:auto; }
  #msg { padding:24px; color:var(--muted); font-size:13px; }
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--fg); color:var(--bg);

</style>
</head>
<body>
<header id="hdr">
  <div class="row">
    <h1>Classroom OS 阶段进度</h1>
    <div class="progress"><div class="track"><div class="fill" id="fill"></div></div><b id="pct">0 / 0</b></div>
    <div class="chips" id="chips"></div>
    <span class="src" id="src"></span>
    <div class="spacer"></div>
    <div class="search"><input id="q" placeholder="搜索编号或关键词，回车定位" autocomplete="off"><span id="qn"></span></div>
    <label class="btn" id="importBtn" title="读入一份 phases.json">导入<input type="file" id="file" accept=".json,application/json"></label>
    <button id="export" title="复制命令或 phases.json，同步回仓库">导出</button>
    <button id="panelToggle">面板</button>
  </div>
  <div class="row">
    <div class="seg tabs" id="tabs"><button data-tab="graph">依赖图</button><button data-tab="board">看板</button></div>
    <div class="group b-only"><b>筛选</b><div class="seg" id="filters"></div></div>
    <span class="hint b-only">按模块分区 · 点卡片看详情，切回依赖图会继续高亮它的上下游</span>
    <div class="group g-only"><b>视图</b><div class="seg" id="views"></div></div>
    <div class="group g-only"><b>叠加</b><button class="tog" id="crit">关键路径</button><button class="tog" id="fade">淡化已完成</button></div>
    <div class="group g-only"><b>线</b><button class="tog on" data-kind="hard">硬依赖</button><button class="tog on" data-kind="integration">完整联调</button><button class="tog on" data-kind="paid">付费前置</button></div>
    <div class="group g-only"><b>选中时</b><div class="seg" id="chain"><button data-c="direct">直接上下游</button><button data-c="all">整条链</button></div></div>
    <div class="group g-only"><button id="dir">横向</button><button id="fit">适应窗口</button></div>
    <span class="hint g-only">点节点看详情 · Shift+点另一个节点看两者间路径 · Esc 取消</span>
  </div>
</header>
<main>
  <div id="left">
    <div id="stage"><div id="canvas"><div id="msg">正在渲染…</div></div></div>
    <div id="board"></div>
  </div>
  <aside id="panel"></aside>
</main>
<div id="tip"></div>
<div id="modal"><div class="box">
  <h3>导出 <div class="seg" id="exTabs"><button data-t="cmd" class="on">命令</button><button data-t="json">phases.json</button></div></h3>
  <textarea id="exText" readonly></textarea>
  <p id="exHelp"></p>
  <div class="act"><span id="copyState"></span><button id="close">关闭</button><button id="copy">复制</button></div>
</div></div>
<div id="toast"></div>

    <div class="muted" style="margin-bottom:8px">${esc(title(pth.to))} 通过 ${pth.edges.size} 条依赖、经过 ${ids.length - 2} 个中间阶段依赖于 ${esc(title(pth.from))}（按当前显示的线类型计算）。</div>
    <ul>${ids.map(x => item(x, LABEL[shown(x)])).join('')}</ul>
    <div class="lines">再 Shift + 点别的节点换终点；点空白处或 Esc 退出。</div>`;
}
function setStatus(id, s0) {
  const p = byId[id]; if (p.status === s0) return;
  p.status = s0; p.history = p.history || [];
  const t = today(), last = p.history[p.history.length - 1];
  if (last && last.date === t) {
    last.status = s0; const prev = p.history[p.history.length - 2];
    if (prev && prev.status === s0) p.history.pop();
    else if (!prev && s0 === 'todo') p.history.pop();
  } else p.history.push({ date:t, status:s0 });
  if (!p.history.length) delete p.history;
}
function bindDetail(id) {
  const p = byId[id];
  $('dx').onclick = () => select(null);
  document.querySelectorAll('.stbtns [data-s]').forEach(b => b.onclick = () => { setStatus(id, b.dataset.s); refresh(); });
  const owner = $('fOwner'); owner.onchange = () => { const v = owner.value.trim(); if (v) p.owner = v; else delete p.owner; refresh(); };
  const note = $('fNote'); note.onchange = () => { const v = note.value.trim(); if (v) p.note = v; else delete p.note; persist(); renderChrome(); };
  const add = () => { const v = $('fPr').value.trim(); if (!v) return; p.prs = p.prs || []; if (!p.prs.includes(v)) p.prs.push(v); refresh(); };
  $('addPr').onclick = add; $('fPr').onkeydown = e => { if (e.key === 'Enter') add(); };
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { p.prs.splice(+b.dataset.rm, 1); if (!p.prs.length) delete p.prs; refresh(); });
}

// ---------------- selection & focus ----------------
function select(id, opts = {}) {
  if (opts.path && sel && id && id !== sel) { pathTo = id; if (!pathBetween(sel, id)) { toast(`${sel} 和 ${id} 之间没有依赖路径`); pathTo = null; } }
  else { sel = id; pathTo = null; }
  renderPanel(); paint(); renderBoard();
  if (id && window.innerWidth <= 900) $('panel').classList.add('open');
}
function focusNode(id) {
  const el = nodeEl[id]; if (!el) return;
  const sr = stage.getBoundingClientRect();
  if (s < .75) { const r = el.g.getBoundingClientRect(); zoomAt(.9 / s, r.left + r.width / 2 - sr.left, r.top + r.height / 2 - sr.top); }
  const r = el.g.getBoundingClientRect();
  tx += sr.width / 2 - (r.left + r.width / 2 - sr.left); ty += sr.height / 2 - (r.top + r.height / 2 - sr.top); apply();
}
$('panel').addEventListener('click', e => {
  const li = e.target.closest('[data-go]'); if (!li) return;
  const id = li.dataset.go; select(id); if (ui.tab === 'board') scrollCard(id); else focusNode(id);
});

// ---------------- pan / zoom / tap / hover ----------------
function apply() { canvas.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; }
function fit() {
  if (!svg) return;
  const w = +svg.getAttribute('width') || svg.getBBox().width, h = +svg.getAttribute('height') || svg.getBBox().height;
  const W = stage.clientWidth, H = stage.clientHeight, pad = 20;
  s = Math.min((W - pad * 2) / w, (H - pad * 2) / h, 1.4);
  tx = (W - w * s) / 2; ty = Math.max(pad, (H - h * s) / 2); apply();
}
function zoomAt(f, cx, cy) { const ns = Math.min(4, Math.max(.1, s * f)); f = ns / s; tx = cx - (cx - tx) * f; ty = cy - (cy - ty) * f; s = ns; apply(); }
function nodeAt(x, y) {
  const el = document.elementFromPoint(x, y), g = el && el.closest && el.closest('#canvas g.node'); if (!g) return null;
  for (const id in nodeEl) if (nodeEl[id].g === g) return id; return null;
}
const pts = new Map(); let drag = null, pinch = null, down = null;
stage.addEventListener('pointerdown', e => {
  if (e.shiftKey) e.preventDefault();
  pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pts.size === 1) { drag = { x:e.clientX - tx, y:e.clientY - ty }; down = { x:e.clientX, y:e.clientY, shift:e.shiftKey }; }
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.x - b.x, a.y - b.y); drag = null; down = null; }
  hideTip();
});
window.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) { if (e.pointerType === 'mouse' && stage.contains(e.target)) hover(e); return; }
  pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()], d = Math.hypot(a.x - b.x, a.y - b.y), r = stage.getBoundingClientRect();
    zoomAt(d / pinch, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); pinch = d; }
  else if (drag) {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5) { down = null; stage.classList.add('dragging'); }
    if (!down) { tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); }
  }
});
function end(e) {
  if (!pts.has(e.pointerId)) return;
  if (down && pts.size === 1 && e.type === 'pointerup') { const id = nodeAt(e.clientX, e.clientY);
    if (id) { if ((down.shift || e.shiftKey) && sel) select(id, { path:true }); else select(id === sel && !pathTo ? null : id); }
    else select(null); }
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
  if (!pts.size) { drag = null; down = null; stage.classList.remove('dragging'); }
}
window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
stage.addEventListener('wheel', e => { e.preventDefault(); const r = stage.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * .0015), e.clientX - r.left, e.clientY - r.top); hideTip(); }, { passive:false });
stage.addEventListener('pointerleave', hideTip);
const tip = $('tip'); let tipId = null;
function hover(e) {
  const id = nodeAt(e.clientX, e.clientY);
  if (!id) return hideTip();
  if (id !== tipId) {
    tipId = id; const p = byId[id], miss = missing(id), g = gates(id);
    tip.innerHTML = `<b>${esc(title(id))}</b><br>${dotFor(id)} ${LABEL[shown(id)]}${p.owner ? ' · @' + esc(p.owner) : ''}${(p.prs || []).length ? ` · ${p.prs.length} 个 PR` : ''}` +
      `<br><span class="m">${miss.length ? '还差硬依赖：' + esc(miss.join(', ')) : D('hard', id).length ? '硬依赖都已完成' : '没有硬依赖'}</span>` +
      (g ? `<br><span class="m">${esc(g)}</span>` : '') +
      `<br><span class="m">卡住 ${A.bd[id]} 个下游${st(id) !== 'done' ? ` · 第 ${A.wave[id]} 波` : ''}${A.cpSet.has(id) ? ' · 关键路径' : ''}</span>` +
      (p.note ? `<br>${esc(p.note)}` : '');
  }
  tip.style.display = 'block';
  const W = window.innerWidth, H = window.innerHeight, r = tip.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX + 14, W - r.width - 8) + 'px'; tip.style.top = Math.min(e.clientY + 14, H - r.height - 8) + 'px';
}
function hideTip() { tip.style.display = 'none'; tipId = null; }

// ---------------- controls ----------------
function toast(t) { const el = $('toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.opacity = 0, 2400); }
$('views').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (!b) return; ui.view = b.dataset.v; renderChrome(); renderPanel(); paint(); persist(); });
$('crit').onclick = () => { ui.crit = !ui.crit; if (ui.crit) { sel = null; pathTo = null; } renderChrome(); renderPanel(); paint(); persist(); };
$('fade').onclick = () => { ui.fade = !ui.fade; renderChrome(); paint(); persist(); };
document.querySelectorAll('[data-kind]').forEach(b => b.onclick = () => { ui.kinds[b.dataset.kind] = !ui.kinds[b.dataset.kind]; renderChrome(); renderPanel(); paint(); persist(); });
$('chain').addEventListener('click', e => { const b = e.target.closest('[data-c]'); if (!b) return; ui.chain = b.dataset.c; renderChrome(); paint(); persist(); });
$('dir').onclick = () => { ui.dir = ui.dir === 'TD' ? 'LR' : 'TD'; renderChrome(); persist(); renderSvg(true); };
$('fit').onclick = fit;
$('panelToggle').onclick = () => $('panel').classList.toggle('open');
const qi = $('q');
qi.addEventListener('input', () => { query = qi.value; const q = query.trim().toLowerCase();
  const n = q ? data.phases.filter(p => textOf(p).includes(q)).length : 0;
  $('qn').textContent = q ? n : ''; if (q && sel && ui.tab === 'graph') { sel = null; pathTo = null; renderPanel(); } paint(); renderBoard(); });
qi.addEventListener('keydown', e => {
  if (e.key === 'Enter') { const q = query.trim().toLowerCase(); if (!q) return;
    const exact = data.phases.find(p => p.id === q), hit = exact || data.phases.find(p => textOf(p).includes(q));
    if (hit) { query = ''; qi.value = ''; $('qn').textContent = ''; select(hit.id); if (ui.tab === 'board') scrollCard(hit.id); else focusNode(hit.id); qi.blur(); } else toast('没有匹配的阶段'); }
  if (e.key === 'Escape') { qi.value = ''; query = ''; $('qn').textContent = ''; paint(); renderBoard(); qi.blur(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
    if ($('modal').style.display === 'flex') $('modal').style.display = 'none'; else select(null); }
  if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); qi.focus(); }
});
$('src').addEventListener('click', e => {
  const b = e.target.closest('[data-src]'); if (!b) return;
  const act = b.dataset.src;
  if (act === 'discard') { if (b.dataset.arm) { data = clone(base); toast('已撤销本地改动'); } else { b.dataset.arm = 1; b.textContent = '再点一次确认'; setTimeout(() => { if (b.isConnected) { delete b.dataset.arm; b.textContent = '撤销改动'; } }, 3000); return; } }
  if (act === 'restore') { data = stale; stale = null; toast('已恢复旧的本地改动'); }
  if (act === 'drop') { stale = null; }
  sel = null; pathTo = null; index(); renderChrome(); renderPanel(); renderBoard(); persist(); renderSvg(false);
});
$('file').onchange = e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => { try { const d = JSON.parse(rd.result); if (!valid(d)) throw new Error('不是 phases.json 的格式');
      const prev = data; data = d; index(); if (!A.acyclic) { data = prev; index(); throw new Error('硬依赖出现环'); }
      sel = null; pathTo = null;
      renderChrome(); renderPanel(); renderBoard(); persist(); renderSvg(true); toast(`已导入 ${d.phases.length} 个阶段`);
    } catch (err) { toast('导入失败：' + err.message); } e.target.value = ''; };
  rd.readAsText(f);
};
// export
function pyJson(x) { // matches Python json.dumps(ensure_ascii=False) separators
  if (Array.isArray(x)) return '[' + x.map(pyJson).join(', ') + ']';
  if (x && typeof x === 'object') return '{' + Object.keys(x).map(k => JSON.stringify(k) + ': ' + pyJson(x[k])).join(', ') + '}';
  return JSON.stringify(x);
}
function exportJson() {
  const L = ['{'];
  if (data.groups && Object.keys(data.groups).length) L.push('  "groups": {', Object.keys(data.groups).sort().map(k => `    ${JSON.stringify(k)}: ${JSON.stringify(data.groups[k])}`).join(',\n'), '  },');
  L.push('  "phases": [', data.phases.map(p => '    ' + pyJson(p)).join(',\n'), '  ],', '  "edges": {');
  L.push(Object.keys(data.edges).map(k => `    "${k}": [\n` + data.edges[k].map(e => '      ' + pyJson(e)).join(',\n') + '\n    ]').join(',\n'));
  L.push('  }', '}'); return L.join('\n') + '\n';
}
const shq = t => "'" + String(t).replace(/'/g, "'\\''") + "'";
function exportCmd() {
  let c = 'python scripts/roadmap.py set ' + data.phases.map(p => `${p.id} ${p.status}`).join(' ');
  data.phases.forEach(p => { if (p.owner) c += ` --owner ${p.id} ${shq(p.owner)}`; if (p.note) c += ` --note ${p.id} ${shq(p.note)}`; (p.prs || []).forEach(u => c += ` --pr ${p.id} ${shq(u)}`); });
  return c;
}
let exTab = 'cmd';
function showExport() {
  $('exText').value = exTab === 'cmd' ? exportCmd() : exportJson();
  $('exHelp').textContent = exTab === 'cmd'
    ? '在仓库根目录运行（macOS / Linux / PowerShell）。会同步状态、负责人、备注和新增的 PR；状态变化按运行当天记日期。要原样保留页面上的日期历史，用 phases.json。'
    : '整份覆盖仓库里的 docs/roadmap/phases.json，然后运行 python scripts/roadmap.py render。这会原样保留页面上的日期历史。';
  document.querySelectorAll('#exTabs button').forEach(b => b.classList.toggle('on', b.dataset.t === exTab));
  $('copyState').textContent = '';
}
$('export').onclick = () => { showExport(); $('modal').style.display = 'flex'; };
$('exTabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (b) { exTab = b.dataset.t; showExport(); } });
$('close').onclick = () => $('modal').style.display = 'none';
$('modal').onclick = e => { if (e.target === $('modal')) $('modal').style.display = 'none'; };
$('copy').onclick = async () => { const t = $('exText');
  try { await navigator.clipboard.writeText(t.value); $('copyState').textContent = '已复制'; }
  catch (e) { t.focus(); t.select(); $('copyState').textContent = '浏览器不允许自动复制，已全选，请按 Ctrl/⌘+C'; } };
window.addEventListener('resize', layoutTop);

// ---------------- boot ----------------
function ensureMermaid() {
  if (window.mermaid) return Promise.resolve();
  return new Promise(res => { const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js'; sc.onload = sc.onerror = () => res(); document.head.appendChild(sc); });
}
(async () => {
  { const h = location.hash.slice(1); if (h === 'graph' || h === 'board') ui.tab = h; }
  index(); renderChrome(); renderPanel(); renderBoard();
  await loadData();
  index(); renderChrome(); renderPanel(); renderBoard(); persist();
  if (baseFrom !== 'remote' && DATA_URL && location.protocol !== 'about:') toast('没有读到 ' + DATA_URL + '，显示的是页面内置的数据');
  await ensureMermaid();
  if (window.mermaid) mermaid.initialize({ startOnLoad:false, theme: dark ? 'dark' : 'neutral', securityLevel:'strict',
    flowchart:{ curve:'basis', nodeSpacing:36, rankSpacing:62, htmlLabels:true } });
  renderSvg(true);
})();
})();
</script>
